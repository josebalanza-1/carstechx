
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de sesiones</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .contenedor {
            background-color: white;
            width: 100%;
            max-width: 450px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #2563eb;
        }

        .descripcion {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input {
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            padding: 12px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .resultado {
            margin-top: 25px;
            padding: 15px;
            background-color: #eff6ff;
            border-radius: 6px;
            white-space: pre-line;
            overflow-wrap: anywhere;
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: #1e293b;
            color: white;
        }
    </style>
</head>

<body>

    <main>
        <section class="contenedor">
            <h1>Gestión de sesiones</h1>
            <p class="descripcion">Introduce tu nombre para guardarlo en la sesión.</p>

            <form method="post" action="{% url 'sesion' %}">
                {% csrf_token %}

                <input
    type="text"
    name="nombre"
    placeholder="Introduce un nombre"
    minlength="2"
    maxlength="20"
    pattern="[A-Za-zÁÉÍÓÚáéíóúÜüÑñ]+"
    title="Introduce un nombre válido, solo con letras"
    required
>

                <button type="submit">Enviar</button>
            </form>

            {% if nombre %}
                <div class="resultado">
                    <strong>Nombres registrados:</strong>
                    <p>{{ nombre }}</p>
                </div>
            {% endif %}
        </section>
    </main>

    <footer>
        Número de visitas: {{ visitas }}
    </footer>

</body>
</html>
